<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IHY Phase 1 Reports</title>
    <style>
      :root {
        --bg: #0f1419;
        --panel: #1a222c;
        --text: #e8eef4;
        --muted: #8b9aab;
        --line: #2a3542;
        --accent: #3d9cf0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background:
          radial-gradient(ellipse 80% 50% at 20% 0%, #1a2a3a 0%, transparent 55%),
          radial-gradient(ellipse 60% 40% at 100% 100%, #152028 0%, transparent 50%),
          var(--bg);
        color: var(--text);
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 4rem 1.5rem;
      }
      h1 {
        margin: 0 0 0.4rem;
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 2rem;
        color: var(--muted);
        line-height: 1.5;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: var(--panel);
      }
      li + li {
        border-top: 1px solid var(--line);
      }
      a {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        padding: 1rem 1.15rem;
        color: var(--text);
        text-decoration: none;
        transition: background 0.15s ease;
      }
      a:hover {
        background: rgba(61, 156, 240, 0.08);
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .label {
        font-weight: 500;
      }
      .meta {
        font-size: 0.8rem;
        color: var(--muted);
        white-space: nowrap;
      }
      .empty,
      .error {
        padding: 1rem 1.15rem;
        color: var(--muted);
      }
      .error {
        color: #e8a0a0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>IHY Phase 1 Reports</h1>
      <p>Static dashboards discovered from available HTML report files.</p>
      <ul id="report-list">
        <li class="empty">Loading reports…</li>
      </ul>
    </main>
    <script>
      function render(reports) {
        const list = document.getElementById("report-list");
        list.replaceChildren();
        if (!reports.length) {
          const li = document.createElement("li");
          li.className = "empty";
          li.textContent = "No report HTML files found.";
          list.appendChild(li);
          return;
        }
        for (const report of reports) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = report.file;
          const label = document.createElement("span");
          label.className = "label";
          label.textContent = report.label || report.file;
          a.appendChild(label);
          if (report.meta) {
            const meta = document.createElement("span");
            meta.className = "meta";
            meta.textContent = report.meta;
            a.appendChild(meta);
          }
          li.appendChild(a);
          list.appendChild(li);
        }
      }

      fetch("reports.json", { cache: "no-store" })
        .then((res) => {
          if (!res.ok) throw new Error("Could not load reports.json");
          return res.json();
        })
        .then((data) => render(Array.isArray(data.reports) ? data.reports : []))
        .catch((err) => {
          const list = document.getElementById("report-list");
          list.replaceChildren();
          const li = document.createElement("li");
          li.className = "error";
          li.textContent = err.message || "Failed to load reports.";
          list.appendChild(li);
        });
    </script>
  </body>
</html>
