<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IHY Phase 1 Reports</title>
    <style>
      :root {
        --bg: #0f1419;
        --panel: #1a222c;
        --text: #e8eef4;
        --muted: #8b9aab;
        --line: #2a3542;
        --accent: #3d9cf0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background:
          radial-gradient(ellipse 80% 50% at 20% 0%, #1a2a3a 0%, transparent 55%),
          radial-gradient(ellipse 60% 40% at 100% 100%, #152028 0%, transparent 50%),
          var(--bg);
        color: var(--text);
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 4rem 1.5rem;
      }
      h1 {
        margin: 0 0 0.4rem;
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 2rem;
        color: var(--muted);
        line-height: 1.5;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: var(--panel);
      }
      li + li {
        border-top: 1px solid var(--line);
      }
      a {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        padding: 1rem 1.15rem;
        color: var(--text);
        text-decoration: none;
        transition: background 0.15s ease;
      }
      a:hover {
        background: rgba(61, 156, 240, 0.08);
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .label {
        font-weight: 500;
      }
      .meta {
        font-size: 0.8rem;
        color: var(--muted);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>IHY Phase 1 Reports</h1>
      <p>Static dashboards for auth, getme, and text-to-sign runs.</p>
      <ul>
        <li>
          <a href="phase1_auth.html">
            <span class="label">Auth</span>
            <span class="meta">20260830_131124</span>
          </a>
        </li>
        <li>
          <a href="phase1_getme.html">
            <span class="label">Get Me</span>
            <span class="meta">20260830_150414</span>
          </a>
        </li>
        <li>
          <a href="phase1_text_to_sign.html">
            <span class="label">Text to Sign</span>
            <span class="meta">20260830_170247</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
